# v_elite pipeline config.
#
# Hand placement is automatic (Fix 6, stages/fixes3.md): the hands anchor at
# the source wrists, then shift back along the source rest grip's palm-forward
# axis by hand_center_fraction of the hand-length difference (ours - the
# original's; rest bone spans, mean over non-thumb fingers). The derived vector
# is recorded per run as hand_offset_auto in the report.
#
# Overrides, if the automatic seating ever needs art direction:
#   hand_center_fraction = 0.5      # 0 = wrist-anchored .. 1 = fingertip-aligned
#   hand_offset = [x, y, z]         # explicit world vector, bypasses the auto rule
