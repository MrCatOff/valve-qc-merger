[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "valve-qc-merger"
version = "0.2.0"
description = "CLI toolkit for working with GoldSource QC files, SMDs and hitboxes for Counter-Strike 1.6 models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["goldsource", "counter-strike", "qc", "smd", "hitbox", "half-life", "mdl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
# numpy powers the handswap retarget engine (pure-Python hand swap +
# animation retarget). The merge commands remain numpy-free at runtime.
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# retarget stage-2 visual calibration (weapon seating + wrist/finger correction).
# GUI-only; the core pipeline stays dependency-free. Install: pip install -e '.[calibrate]'
calibrate = [
    "numpy>=1.24",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "PySide6>=6.6",
]

[project.scripts]
valve-qc-merger = "valve_qc_merger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/valve_qc_merger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# handswap/ is the vendored pure-Python retarget engine, kept byte-identical
# to the upstream blender-retarget repo so re-syncs stay clean. Its own style
# (percent-format, import layout, immediate-call loop closures) is not
# enforced here; it is verified functionally instead (all 29 stock viewmodels
# convert + pass the built-in verification suite).
"src/valve_qc_merger/handswap/**" = [
    "UP031", "UP015", "E402", "I001", "F401", "F841", "B023", "B905", "E741",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
