[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "valve-qc-merger"
version = "0.1.0"
description = "CLI toolkit for working with GoldSource QC files, SMDs and hitboxes for Counter-Strike 1.6 models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["goldsource", "counter-strike", "qc", "smd", "hitbox", "half-life", "mdl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
valve-qc-merger = "valve_qc_merger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/valve_qc_merger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
