// ReHLDS server cvars (MIT License, (c) ReHLDS contributors)
// From https://github.com/rehlds/ReHLDS README, Configuring — fetched 2026-10-05
// Same layout as ReGameDLL's game.cfg: description, default, the cvar.

// File for permanent ip bans.
// Values: filename
//
// Default value: "listip.cfg"
listipcfgfile "listip.cfg"

// File for the system error log.
// Values: filename
//
// Default value: "sys_error.log"
syserror_logfile "sys_error.log"

// Automatically precache sounds attached to models.
// Values: 1|0
//
// Default value: "0"
sv_auto_precache_sounds_in_models "0"

// Upload custom sprays after entering the game instead of when connecting. It
// increases upload speed.
// Values: 1|0
//
// Default value: "0"
sv_delayed_spray_upload "0"

// Echo in the console when trying execute an unknown command.
// Values: 1|0
//
// Default value: "0"
sv_echo_unknown_cmd "0"

// Print rcon debug in the console.
// Values: 1|0
//
// Default value: "1"
sv_rcon_condebug "1"

// In a 3-rd party plugins used to force colliding of SOLID_SLIDEBOX entities.
// Values: 1|0
//
// Default value: "0"
sv_force_ent_intersection "0"

// Force a client's cl_dlmax cvar to 1024. It avoids an excessive packets
// fragmentation.
// Values: 1|0
//
// Default value: "0"
sv_rehlds_force_dlmax "0"

// Use center of hull instead of corner.
// Values: 1|0
//
// Default value: "0"
sv_rehlds_hull_centering "0"

// Max average level of 'move' cmds for ban.
//
// Default value: "400"
sv_rehlds_movecmdrate_max_avg "400"

// Time in minutes for which the player will be banned (
// 0 - Permanent, use a negative number for a kick).
//
// Default value: "5"
sv_rehlds_movecmdrate_avg_punish "5"

// Max burst level of 'move' cmds for ban.
//
// Default value: "2500"
sv_rehlds_movecmdrate_max_burst "2500"

// Time in minutes for which the player will be banned (
// 0 - Permanent, use a negative number for a kick).
//
// Default value: "5"
sv_rehlds_movecmdrate_burst_punish "5"

// Send mapcycle.txt in serverinfo message (HLDS behavior, but it is unused on
// the client).
// Values: 1|0
//
// Default value: "0"
sv_rehlds_send_mapcycle "0"

// Max average level of 'string' cmds for ban.
//
// Default value: "80"
sv_rehlds_stringcmdrate_max_avg "80"

// Time in minutes for which the player will be banned (
// 0 - Permanent, use a negative number for a kick).
//
// Default value: "5"
sv_rehlds_stringcmdrate_avg_punish "5"

// Max burst level of 'string' cmds for ban.
//
// Default value: "400"
sv_rehlds_stringcmdrate_max_burst "400"

// Time in minutes for which the player will be banned (
// 0 - Permanent, use a negative number for a kick).
//
// Default value: "5"
sv_rehlds_stringcmdrate_burst_punish "5"

// Max size of the dlfile token bucket.
// 0 - automatic (map resource list size + 16), a negative number disables dlfile rate limiting.
//
// Default value: "0"
sv_rehlds_dlfile_bucket_size "0"

// How many dlfile tokens are restored per second.
//
// Default value: "50"
sv_rehlds_dlfile_refillrate "50"

// Time in minutes for which the player will be banned for dlfile flooding (
// 0 - Permanent, use a negative number for a kick).  (kick)
//
// Default value: "-1"
sv_rehlds_dlfile_punish "-1"

// Userinfo fields only with these keys will be transmitted to clients via
// network. If not set then all fields will be transmitted (except prefixed with
// underscore). Each key must be prefixed by backslash, for example
// "\name\model\*sid\*hltv\bottomcolor\topcolor". See
// [wiki](https://github.com/rehlds/ReHLDS/wiki/Userinfo-keys) to collect
// sufficient set of keys for your server.
//
// Default value: ""
sv_rehlds_userinfo_transmitted_fields ""

// Fixes bug with gait animation speed increase when player has some attached
// entities (aiments). Can cause animation lags when cl_updaterate is low.
//
// Default value: "0"
sv_rehlds_attachedentities_playeranimationspeed_fix "0"

// Limit number of connections at the same time from single IP address, not
// confuse to already connected players.
//
// Default value: "5"
sv_rehlds_maxclients_from_single_ip "5"

// A feature of local gametime which decrease "lags" if you run same map for a
// long time.
// Values: 1|0
//
// Default value: "0"
sv_rehlds_local_gametime "0"

// Allow larger custom logos than 64x64.
// Values: 1|0
//
// Default value: "1"
sv_rehlds_allow_large_sprays "1"

// Use custom entity file for a map. Path to an entity file will be "maps/[map
// name].ent".
// 0 - use original entities.
// 1 - use .ent files from maps directory.
// 2 - use .ent files from maps directory and create new .ent file if not exist.
//
// Default value: "0"
sv_use_entity_file "0"

// When enabled server will populate an additional random seed independent of
// the client.
//
// Default value: "0"
sv_usercmd_custom_random_seed "0"

// When enabled server will decompress of incoming compressed file transfer
// payloads.
// Values: 1|0
//
// Default value: "1"
sv_net_incoming_decompression "1"

// Sets the max allowed ratio between compressed and uncompressed data for file
// transfer. (A ratio close to 90 indicates large uncompressed data with low
// entropy)
// Values: 0|100
//
// Default value: "80.0"
sv_net_incoming_decompression_max_ratio "80.0"

// Sets the max allowed size for decompressed file transfer data. bytes
// Values: 16|65536
//
// Default value: "65536"
sv_net_incoming_decompression_max_size "65536"

// Sets the min number of decompression failures required before a player's
// connection is flagged for potential punishment.
// Values: 0|10
//
// Default value: "4"
sv_net_incoming_decompression_min_failures "4"

// Sets the max number of decompression failures allowed within a specified time
// window before action is taken against the player.
// Values: 0|10
//
// Default value: "10"
sv_net_incoming_decompression_max_failures "10"

// Sets the min time in secs within which decompression failures are tracked to
// determine if the player exceeds the failure thresholds.
// Values: 0.1|10.0
//
// Default value: "0.1"
sv_net_incoming_decompression_min_failuretime "0.1"

// Time in minutes for which the player will be banned for malformed/abnormal
// bzip2 fragments (
// 0 - Permanent, use a negative number for a kick).
//
// Default value: "-1"
sv_net_incoming_decompression_punish "-1"

// Sets a string defining the "gametags" for this server, this is optional, but
// if it is set it allows users/scripts to filter in the
// matchmaking/server-browser interfaces based on the value.
// Values: comma-delimited string list of tags
//
// Default value: ""
sv_tags ""

// Set packet filtering by IP mode. -
// 1 - All players will be rejected without any exceptions.
// 0 - No checks will happen.
// 1 - All incoming players will be checked if they're IP banned (if they have an IP filter entry), if they are, they will be kicked.
//
// Default value: "1"
sv_filterban "1"

// Set maximum amount of movement commands the server is able to process from a
// single player in a single frame. This includes the commands itself, not
// packets.
//
// Default value: "24"
sv_rehlds_movecmd_max_ticks "24"

// Defines the maximum allowed consecutive movement commands with zero time
// duration (empty commands).
// 0 - disables the check.
//
// Default value: "0"
sv_rehlds_movecmd_max_null_streak "0"

// Defines whether should the server block movement commands with invalid (out
// of range) "ex_interp" value.
// Values: 1|0
//
// Default value: "1"
sv_rehlds_movecmd_clamp_interp "1"

// Defines the number of frames the server takes to average the client's
// movement speed. Higher - more accurate but slower detection, lower - vice
// versa.
//
// Default value: "120"
sv_rehlds_movecmdtime_samples "120"

// Defines how far a client's internal game clock can go ahead of or behind the
// server's clock in milliseconds. If this limit is exceeded, the server
// evaluates the client's game speed. Penalties are ONLY applied if the client
// also violates the "sv_rehlds_movecmdtime_max_scale" or
// "sv_rehlds_movecmdtime_min_scale" limits.
//
// Default value: "300"
sv_rehlds_movecmdtime_max_error "300"

// Defines the max client's base game speed ratio. Clients speeding the game up
// beyond this multiplier will receive warnings.
//
// Default value: "3.0"
sv_rehlds_movecmdtime_max_scale "3.0"

// Defines the min client's base game speed ratio. Clients slowing the game down
// below this multiplier will receive warnings.
//
// Default value: "0.5"
sv_rehlds_movecmdtime_min_scale "0.5"

// Maximum allowed speedhack/slowmo warnings before the punishment is applied. -
// 1 - disable detection.
//
// Default value: "-1"
sv_rehlds_movecmdtime_max_warnings "-1"

// Time in minutes for which the player will be banned for speedhacking/slowing
// (-
// 1 - Kick,
// 0 - Permanent, use a negative number for a kick).
//
// Default value: "-1"
sv_rehlds_movecmdtime_punish "-1"

// Hard deadline in seconds for a client to re-initiate its connection after a
// level change, independent of netchan activity. Closes a phantom-slot exploit
// where a cheat blocks the "reconnect" command and keeps the netchan warm so
// sv_timeout never fires.
// 0 - disabled.
//
// Default value: "30"
sv_reconnect_timeout "30"
