name: tests

# Lint, then the test suite — sized to what the event needs (Actions
# minutes: macOS counts 10x, Windows 2x):
#   push to dev            lint + Linux only; a newer push cancels the older run
#   pull request to main   lint + Windows, Linux, macOS
#   manual / release       lint + Windows, Linux, macOS (build-exe calls this
#                          with full: true before it builds anything)
# A push to main runs nothing: it is the commit dev already tested.
# Docs-only changes run nothing.
# GUI tests run on Qt's offscreen platform; the real OpenGL render test
# skips itself where no OpenGL is available (CI runners).

on:
  push:
    branches: [dev]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: "test on Windows, Linux and macOS"
        type: boolean
        default: true

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ruff
        run: python -m pip install ruff && python -m ruff check src tests

  pytest:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # a dev push: Linux only; everything else: every platform
        os: ${{ fromJSON((github.event_name == 'push' && !inputs.full) && '["ubuntu-latest"]' || '["windows-latest", "ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[dev,studio]"
      - name: Test
        run: python -m pytest -q
