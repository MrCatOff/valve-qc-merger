name: tests

# The full test suite on every push / pull request, Windows first.
# GUI tests run on Qt's offscreen platform; the real OpenGL render test
# skips itself where no OpenGL is available (CI runners).

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[dev,studio]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m pytest -q
