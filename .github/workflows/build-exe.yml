name: build-exe

# Standalone executables (no Python needed on the target machine).
# Runs on manual dispatch and on version tags; download from the run's
# artifacts (valve-qc-merger-windows / -macos / -linux).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: valve-qc-merger-windows
            binary: dist/valve-qc-merger.exe
          - os: macos-latest
            artifact: valve-qc-merger-macos
            binary: dist/valve-qc-merger
          - os: ubuntu-latest
            artifact: valve-qc-merger-linux
            binary: dist/valve-qc-merger
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: tools\build_exe.bat
        shell: cmd
      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: sh tools/build_exe.sh
      - name: Smoke test
        run: |
          ${{ matrix.binary }} --version
          ${{ matrix.binary }} merge-p tests/examples/player --out smoke_out --name p_smoke
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
